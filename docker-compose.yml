services:
  # 1. Base de données PostgreSQL
  postgres_db:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: myapp_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

  # 2. Serveur d'applications JBoss (WildFly 26 - Compatible Java EE)
  jboss_app:
    build:
      context: .
      dockerfile: Dockerfile.jboss
    container_name: jboss_app
    ports:
      - "8080:8080"
      - "9990:9990"
    environment:
      - DB_HOST=postgres_db
      - DB_NAME=monitoring_test
      - DB_USER=monitoring_app
      - DB_PASS=monitoring_pass_2026
    depends_on:
      - postgres_db
    networks:
      - app-network

  # 3. Collecteur de métriques pour PostgreSQL (CORRIGÉ : Image directe)
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres_exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://monitoring_app:change-me@postgres_db:5432/monitoring_test?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      - postgres_db
    networks:
      - app-network

  # 4. Serveur Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - postgres-exporter
    networks:
      - app-network

  # 5. Outil de Visualisation (Grafana)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - app-network
  # 6. Stockage des logs (Loki)
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    networks:
      - app-network

 # 7. Collecteur de logs (Promtail)
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Accès direct aux logs via l'API Docker
      - ./promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - app-network

volumes:
  pgdata:
  grafana-storage:

networks:
  app-network:
    driver: bridge
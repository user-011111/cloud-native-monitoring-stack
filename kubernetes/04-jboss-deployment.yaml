apiVersion: apps/v1
kind: Deployment
metadata:
  name: jboss-deployment
  namespace: monitoring-app
  labels:
    app: jboss
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jboss
  template:
    metadata:
      labels:
        app: jboss
    spec:
      containers:
        - name: jboss
          image: user011111/cloud-native-monitoring-stack:v5
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9990
              name: admin
          env:
            - name: DB_HOST
              value: "postgres-service"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: postgres-db
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: postgres-user
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: postgres-password
---
apiVersion: v1
kind: Service
metadata:
  name: jboss-service
  namespace: monitoring-app
spec:
  type: NodePort
  selector:
    app: jboss
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
    - name: admin
      port: 9990
      targetPort: 9990
      nodePort: 30990

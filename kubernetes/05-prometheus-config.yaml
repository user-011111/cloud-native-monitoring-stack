apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring-app
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'jboss-app'
        metrics_path: '/metrics.jsp'
        static_configs:
          - targets: ['jboss-service:8080']
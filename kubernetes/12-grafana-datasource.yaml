apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring-app
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus-ds-uid
        url: http://prometheus-service:9090
        access: proxy
        isDefault: true

      - name: Loki
        type: loki
        uid: loki-ds-uid
        url: http://loki-service:3100   # Vérifie si le nom du Service Loki dans 09-loki-promtail.yaml est bien 'loki' ou 'loki-service'
        access: proxy